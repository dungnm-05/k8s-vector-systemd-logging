data_dir: /var/lib/vector

api:
  enabled: true
  address: "0.0.0.0:8686"

sources:
  kubernetes_pod_logs:
    type: file
    include:
      - /var/log/pods/*/*/*.log
    read_from: end
    ignore_checkpoints: false

  journald_kubelet:
    type: journald
    include_units:
      - kubelet.service
    current_boot_only: false

  journald_containerd:
    type: journald
    include_units:
      - containerd.service
    current_boot_only: false

  kubernetes_events:
    type: exec
    mode: scheduled
    scheduled:
      exec_interval_secs: 30
    command:
      - bash
      - -c
      - kubectl get events --all-namespaces --sort-by=.lastTimestamp -o json | python3 -c 'import sys,json; [print(json.dumps(e)) for e in json.load(sys.stdin).get("items",[])]'

transforms:
  process_pod_logs:
    type: remap
    inputs:
      - kubernetes_pod_logs
    source: |
      cri, _err = parse_regex(string(.message) ?? "", r'^(?P<cri_ts>\S+)\s+(?P<stream>stdout|stderr)\s+\S+\s+(?P<log>.+)$')
      if cri != null {
        .message = string(cri.log) ?? ""
      }

      # Parse /var/log/pods/<namespace>_<pod>_<uid>/<container>/<N>.log
      filepath = string(.file) ?? ""
      if filepath == "" { abort }
      path_parts = split(filepath, "/")
      # path_parts[4] = "<namespace>_<pod>_<uid>", path_parts[5] = container, path_parts[6] = "N.log"
      pod_segment = string(get!(path_parts, [4])) ?? ""
      if pod_segment == "" { abort }
      pod_parts = split(pod_segment, "_")
      .k8s_namespace = string(get!(pod_parts, [0])) ?? "unknown"
      # pod name is everything between first and last underscore (uid is last segment)
      pod_parts_len = length(pod_parts)
      .k8s_pod       = join!(slice!(pod_parts, 1, pod_parts_len - 1), "_")
      .k8s_container = string(get!(path_parts, [5])) ?? "unknown"
      .k8s_node      = "node1"

      ns  = .k8s_namespace
      pod = .k8s_pod
      .log_source = if ns == "ingress-nginx" {
        "ingress"
      } else if ns == "kube-system" && contains(pod, "coredns") {
        "coredns"
      } else if ns == "kube-system" && contains(pod, "calico") {
        "calico"
      } else if ns == "kube-system" {
        "k8s-system"
      } else {
        "app"
      }

      parsed, err = parse_json(string(.message) ?? "")
      if err == null {
        . = merge(., object!(parsed))
        .is_json_log = true
        if !exists(.message) { .message = "" }
      } else {
        .is_json_log = false
      }

      if exists(.timestamp) && .timestamp != null {
        ts, ts_err = parse_timestamp(to_string!(.timestamp), "%+")
        if ts_err == null { .@timestamp = ts }
        del(.timestamp)
      }
      if !exists(.@timestamp) { .@timestamp = now() }

      # BUG-3 fix: kiểm tra exists trước để tránh string() fail trên null
      raw_level = if exists(.level) && .level != null {
        to_string!(.level)
      } else if exists(.Level) && .Level != null {
        to_string!(.Level)
      } else if exists(.severity) && .severity != null {
        to_string!(.severity)
      } else {
        "info"
      }
      raw = downcase(raw_level)
      .log_level = if includes(["error","err","fatal","critical","crit"], raw) {
        "ERROR"
      } else if includes(["warn","warning"], raw) {
        "WARN"
      } else {
        "INFO"
      }
      del(.level); del(.Level); del(.severity)
      del(.file); del(.source_type)

  process_kubelet_logs:
    type: remap
    inputs:
      - journald_kubelet
    source: |
      .log_source    = "kubelet"
      .k8s_node      = string(._HOSTNAME) ?? "unknown"
      .k8s_namespace = "kube-system"
      .k8s_pod       = "host/" + string(.k8s_node)
      .k8s_container = "kubelet"
      .is_json_log   = false
      priority = to_int(.PRIORITY) ?? 6
      .log_level = if priority <= 3 { "ERROR" } else if priority == 4 { "WARN" } else { "INFO" }
      .@timestamp = now()
      del(.PRIORITY); del(.SYSTEMD_UNIT); del(.SYSLOG_IDENTIFIER)
      del(._HOSTNAME); del(._MACHINE_ID); del(._BOOT_ID)
      del(._TRANSPORT); del(._UID); del(._GID); del(._PID)
      del(._COMM); del(._EXE); del(._CMDLINE)
      del(.source_type)

  process_containerd_logs:
    type: remap
    inputs:
      - journald_containerd
    source: |
      .log_source    = "containerd"
      .k8s_node      = string(._HOSTNAME) ?? "unknown"
      .k8s_namespace = "kube-system"
      .k8s_pod       = "host/" + string(.k8s_node)
      .k8s_container = "containerd"
      .is_json_log   = false
      priority = to_int(.PRIORITY) ?? 6
      .log_level = if priority <= 3 { "ERROR" } else if priority == 4 { "WARN" } else { "INFO" }
      .@timestamp = now()
      del(.PRIORITY); del(.SYSTEMD_UNIT); del(.SYSLOG_IDENTIFIER)
      del(._HOSTNAME); del(._MACHINE_ID); del(._BOOT_ID)
      del(._TRANSPORT); del(._UID); del(._GID); del(._PID)
      del(._COMM); del(._EXE); del(._CMDLINE)
      del(.source_type)

  process_events:
    type: remap
    inputs:
      - kubernetes_events
    source: |
      ev, err = parse_json(string!(.message))
      if err != null { abort }
      .log_source         = "k8s-event"
      .event_type         = string(ev.type)              ?? "Normal"
      .event_reason       = string(ev.reason)            ?? "Unknown"
      .event_message      = string(ev.message)           ?? ""
      .event_count        = to_int(ev.count)             ?? 1
      .event_source       = string(ev.source.component)  ?? "unknown"
      .involved_kind      = string(ev.involvedObject.kind)      ?? ""
      .involved_name      = string(ev.involvedObject.name)      ?? ""
      .involved_namespace = string(ev.involvedObject.namespace) ?? ""
      .k8s_namespace      = .involved_namespace
      ts_str = string(ev.lastTimestamp) ?? string(ev.eventTime) ?? null
      if ts_str != null {
        ts, ts_err = parse_timestamp(string!(ts_str), "%+")
        .@timestamp = if ts_err == null { ts } else { now() }
      } else {
        .@timestamp = now()
      }
      .log_level = if .event_type == "Warning" { "WARN" } else { "INFO" }
      .message   = .event_reason + ": " + .event_message
      del(.source_type)

sinks:
  es_k8s_logs:
    type: elasticsearch
    inputs:
      - process_pod_logs
      - process_kubelet_logs
      - process_containerd_logs
    endpoints:
      - https://192.168.122.25:9200
    auth:
      strategy: basic
      user: elastic
      password: "111111"
    tls:
      ca_file: /etc/vector/certs/http_ca.crt
    bulk:
      index: "k8s-logs-%Y.%m.%d"
      action: create
    batch:
      max_events: 100
      timeout_secs: 5

  es_k8s_events:
    type: elasticsearch
    inputs:
      - process_events
    endpoints:
      - https://192.168.122.25:9200
    auth:
      strategy: basic
      user: elastic
      password: "111111"
    tls:
      ca_file: /etc/vector/certs/http_ca.crt
    bulk:
      index: "k8s-events-%Y.%m.%d"
      action: create
    batch:
      max_events: 100
      timeout_secs: 10
